<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hello Bossing</title>

<!-- Instagram / Social Media Preview -->
<meta property="og:title" content="Hello Bossing 👀">
<meta property="og:description" content="Wanna see something cool? 😏">
<meta property="og:image" content="https://hi-bossing.netlify.app/preview.jpg">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hi-bossing.netlify.app/">

<!-- Optional Twitter Preview -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Hello Bossing 👀">
<meta name="twitter:description" content="Wanna see something cool? 😏">
<meta name="twitter:image" content="https://hi-bossing.netlify.app/preview.jpg">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Aptos Narrow",sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #819171,
        #cbd5c0
    );
    overflow:hidden;
    position:relative;
    padding:20px;
}

.container{
    background:white;
    padding:40px 30px;
    border-radius:25px;
    text-align:center;
    width:85%;
    max-width:350px;
    box-shadow:
        0 5px 15px rgba(0,0,0,0.2);
    z-index:10;
    position:relative;
}

h1{
    color:#819171;
    margin-bottom:15px;
    font-size:28px;
}

p{
    color:#555;
    margin-bottom:25px;
    line-height:1.5;
}

.buttons{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    margin-top:20px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
    transition:0.2s;
}

#yesBtn{
    background:#819171;
    color:white;
    padding:14px 24px;
}

#noBtn{
    background:#eee;
    color:#333;
    padding:14px 24px;
    position:relative;
    z-index:20;
}

#result{
    display:none;
    margin-top:25px;
    font-size:24px;
    color:#819171;
    animation:fadeIn 0.5s ease;
}

#resultImage{
    width:100%;
    max-width:280px;
    border-radius:15px;
    margin-bottom:15px;
    display:block;
    margin-left:auto;
    margin-right:auto;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.heart{
    position:absolute;
    font-size:20px;
    animation:float 6s linear infinite;
    opacity:0.8;
    pointer-events:none;
}

@keyframes float{

    from{
        transform:translateY(100vh);
        opacity:1;
    }

    to{
        transform:translateY(-10vh);
        opacity:0;
    }

}

</style>

</head>

<body>

<div class="container">

    <h1>Hello Bossing,</h1>

    <p>
        Wanna see something cool? 😏
    </p>

    <div class="buttons">

        <button id="yesBtn">
            Okay!
        </button>

        <button id="noBtn">
            What is it?
        </button>

    </div>

    <div id="result">

        <img
            src="./IMG_0763.gif"
            alt="Surprise GIF"
            id="resultImage"
        >

        <div>
            This with you 👉🏼👈🏼
        </div>

    </div>

</div>

<script>

const noBtn =
document.getElementById("noBtn");

const noTexts = [

    "Bakit duda ka?",
    "Parang ayaw mo e",
    "Luh! Parang ayaw talaga",
    "Sure ka ayaw mo?",
    "Wow! No mercy",
    "Mag cry na lang ako",
    "Last chance",
    "Sad na ako",
    "Bat ka ganyan 😭",
    "HAHA ayaw mo talaga?"

];

let index = 0;

function moveButton(){

    if(index < noTexts.length){

        noBtn.innerText =
        noTexts[index];

        index++;

    }

    setTimeout(()=>{

        const padding = 20;

        const maxX =
        Math.max(
            0,
            window.innerWidth -
            noBtn.offsetWidth -
            (padding * 2)
        );

        const maxY =
        Math.max(
            0,
            window.innerHeight -
            noBtn.offsetHeight -
            (padding * 2)
        );

        const randomX =
        padding +
        Math.random() * maxX;

        const randomY =
        padding +
        Math.random() * maxY;

        noBtn.style.position = "fixed";

        noBtn.style.left =
        randomX + "px";

        noBtn.style.top =
        randomY + "px";

    },10);

}

noBtn.addEventListener(
    "mouseover",
    moveButton
);

noBtn.addEventListener(
    "click",
    moveButton
);

noBtn.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();
        moveButton();

    }
);

document
.getElementById("yesBtn")
.addEventListener("click",()=>{

    document
    .getElementById("result")
    .style.display="block";

    document
    .querySelector(".buttons")
    .style.display="none";

    noBtn.style.display="none";

});

function createHeart(){

    const heart =
    document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML = "👉🏼👈🏼";

    heart.style.left =
    Math.random() * 100 + "vw";

    heart.style.fontSize =
    (Math.random() * 20 + 10) + "px";

    document.body.appendChild(heart);

    setTimeout(()=>{

        heart.remove();

    },6000);

}

setInterval(createHeart,300);

</script>

</body>
</html>
